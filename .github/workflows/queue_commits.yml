name: Queue Commits From Bevy Main

on:
  workflow_dispatch:
  schedule:
    - cron: "7,27,47 * * * *"

env:
  SUITES: "build benches rendering"

jobs:
  queue-latest-commit:
    name: Queue Latest Commit
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Bevy main branch
        uses: actions/checkout@v4
        with:
          repository: "bevyengine/bevy"
          ref: "main"
      - uses: actions/checkout@v4
        with:
          ref: "queue"
          path: "queue"
      - uses: actions/checkout@v4
        with:
          ref: "results"
          path: "results"
      - name: Queue latest commit
        id: queue
        run: |
          set -euo pipefail
          gitref=$(git rev-parse HEAD)
          added=0
          for suite in $SUITES; do
            # Already waiting for this suite?
            if [ -e "queue/$suite/$gitref" ]; then
              echo "$suite: already queued"
              continue
            fi
            dir="results/${gitref:0:1}/${gitref:1:1}/$gitref"
            if [ -f "$dir/stats.$suite.json" ] || [ -f "$dir/stats.json" ]; then
              echo "$suite: already collected"
              continue
            fi
            mkdir -p "queue/$suite"
            touch "queue/$suite/$gitref"
            echo "$suite: queued $gitref"
            added=$((added + 1))
          done
          echo "ADDED=$added" >> "$GITHUB_OUTPUT"
      - name: Commit
        if: steps.queue.outputs.ADDED > 0
        run: |
          cd queue
          git config user.name 'Workflow'
          git config user.email '<>'

          git add .
          git commit -m "Queued new commit for ${{ steps.queue.outputs.ADDED }} suite(s)"
          git push

  queue-history-commits:
    needs: [queue-latest-commit]
    name: Backfill History Per Suite
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Bevy main branch
        uses: actions/checkout@v4
        with:
          repository: "bevyengine/bevy"
          ref: "main"
          path: "bevy"
          fetch-depth: 500
      - uses: actions/checkout@v4
        with:
          ref: "queue"
          path: "queue"
      - uses: actions/checkout@v4
        with:
          ref: "results"
          path: "results"
      - name: Backfill each idle suite
        id: queue
        run: |
          set -euo pipefail
          max=3
          added=0
          summary=""

          commits=$(cd bevy && git log --no-abbrev-commit --pretty=format:%H | sort)

          for suite in $SUITES; do
            if [ -d "queue/$suite" ]; then
              echo "$suite: still queued, not backfilling"
              continue
            fi

            i=0
            missing=0
            for commit in $commits; do
              dir="results/${commit:0:1}/${commit:1:1}/$commit"
              if [ -f "$dir/stats.$suite.json" ] || [ -f "$dir/stats.json" ]; then
                continue
              fi
              missing=$((missing + 1))
              if [ "$i" -lt "$max" ]; then
                mkdir -p "queue/$suite"
                touch "queue/$suite/$commit"
                i=$((i + 1))
              fi
            done
            echo "$suite: queued $i of $missing missing commits"
            added=$((added + i))
            [ "$i" -gt 0 ] && summary="$summary $suite=$i/$missing"
          done

          echo "ADDED=$added" >> "$GITHUB_OUTPUT"
          echo "SUMMARY=$summary" >> "$GITHUB_OUTPUT"
      - name: Commit
        if: steps.queue.outputs.ADDED > 0
        run: |
          cd queue
          git config user.name 'Workflow'
          git config user.email '<>'

          git add .
          git commit -m "Backfilled history commits:${{ steps.queue.outputs.SUMMARY }}"
          git push
